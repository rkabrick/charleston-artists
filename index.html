<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charleston on Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f0e4;
    --paper-2: #efe6d4;
    --paper-3: #e5d9c2;
    --ink: #1e2a26;
    --ink-2: #4b5751;
    --ink-3: #7b8179;
    --rule: #dbcfb8;
    --palmetto: #2d5a4b;
    --on-palmetto: #f6f0e4;

    /* Rainbow Row */
    --pink: #ecbcb8;
    --butter: #f2d88c;
    --mint: #b7d9c2;
    --sky: #b6cfe4;
    --lilac: #cfc2e2;
    --coral: #efab8f;
    --sand: #e8d2ae;
    --window: #f8f3e9;
    --window-lit: #fbecc0;
    --cornice: rgba(30, 42, 38, 0.14);
    --door: #34443e;

    --linked-bg: #d3e8d9;
    --linked-fg: #1f4a3b;
    --name-bg: #f7e6ae;
    --name-fg: #634c0c;
    --error-fg: #9a3f22;

    --shadow: 0 1px 0 rgba(30, 42, 38, 0.04), 0 18px 40px -24px rgba(30, 42, 38, 0.45);
    --display: "Gloock", "Iowan Old Style", Georgia, serif;
    --body: "Hanken Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    --gutter: clamp(16px, 4vw, 44px);
    --toolbar-h: 64px;
    color-scheme: light;
  }

  /* Charleston at night: dark harbor, lamplit windows. */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #11181b;
      --paper-2: #172024;
      --paper-3: #1f2a2f;
      --ink: #efe7d6;
      --ink-2: #bdb6a6;
      --ink-3: #8a8c84;
      --rule: #29353a;
      --palmetto: #8fc3a8;
      --on-palmetto: #0f1a16;

      --pink: #6e4a4f;
      --butter: #75653c;
      --mint: #3f5f51;
      --sky: #3e566c;
      --lilac: #54496a;
      --coral: #74493b;
      --sand: #665641;
      --window: #222d33;
      --window-lit: #f3d283;
      --cornice: rgba(0, 0, 0, 0.3);
      --door: #0b1012;

      --linked-bg: rgba(143, 195, 168, 0.15);
      --linked-fg: #a7d5bc;
      --name-bg: rgba(242, 216, 140, 0.13);
      --name-fg: #efd28a;
      --error-fg: #f0a48a;

      --shadow: 0 1px 0 rgba(0, 0, 0, 0.2), 0 18px 40px -20px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  /* paper grain */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.07;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  @media (prefers-color-scheme: dark) {
    body::before { mix-blend-mode: screen; opacity: 0.035; }
  }

  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    position: relative;
    background: linear-gradient(to bottom, var(--paper-2), var(--paper) 85%);
    border-bottom: 3px solid var(--ink);
    overflow: hidden;
  }
  .mast-grid {
    max-width: 1440px;
    margin: 0 auto;
    padding: clamp(28px, 5vw, 56px) var(--gutter) 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 28px 48px;
    align-items: end;
  }
  .kicker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font: 700 0.72rem/1 var(--body);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--palmetto);
  }
  .kicker::before { content: ""; width: 28px; height: 2px; background: currentColor; }
  h1 {
    margin: 16px 0 0;
    font: 400 clamp(3.1rem, 10vw, 7.6rem)/0.86 var(--display);
    letter-spacing: -0.025em;
  }
  h1 small {
    display: block;
    margin-top: 14px;
    font: 500 clamp(1.05rem, 2.3vw, 1.55rem)/1.2 var(--body);
    letter-spacing: 0.01em;
    color: var(--ink-2);
  }
  .dek { max-width: 54ch; margin: 14px 0 0; color: var(--ink-2); }

  .ledger { display: grid; gap: 16px; justify-items: end; min-width: 300px; }
  .stats { display: flex; gap: 28px; margin: 0; }
  .stats div { text-align: right; }
  .stats dt {
    font: 700 0.68rem/1 var(--body);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .stats dd {
    margin: 6px 0 0;
    font: 400 2.1rem/1 var(--display);
    font-variant-numeric: tabular-nums;
  }
  .stats dd.when { font: 600 1rem/2.1rem var(--body); color: var(--ink-2); }

  .refresh {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 20px;
    border: 0;
    border-radius: 4px;
    background: var(--ink);
    color: var(--paper);
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .refresh:hover:not(:disabled) { background: var(--palmetto); color: var(--on-palmetto); }
  .refresh:active:not(:disabled) { transform: translateY(1px); }
  .refresh[hidden] { display: none; }
  .refresh:disabled { opacity: 0.55; cursor: not-allowed; }
  .refresh:focus-visible { outline: 2px solid var(--palmetto); outline-offset: 3px; }
  .refresh svg { width: 16px; height: 16px; }
  .refresh.busy svg { animation: spin 1s linear infinite; }

  .progress { width: 100%; display: grid; gap: 6px; font-size: 0.82rem; color: var(--ink-2); text-align: right; }
  .progress[hidden] { display: none; }
  .track { height: 4px; border-radius: 4px; background: var(--paper-3); overflow: hidden; }
  .track span {
    display: block; height: 100%; width: 0;
    background: var(--palmetto);
    transition: width 0.3s ease;
  }
  .track.indeterminate span { width: 35%; animation: slide 1.2s ease-in-out infinite; }

  .notice {
    max-width: 380px;
    margin: 0;
    padding: 10px 14px;
    border-left: 3px solid var(--coral);
    background: var(--paper-2);
    font-size: 0.85rem;
    color: var(--ink-2);
    text-align: left;
  }
  .notice[hidden] { display: none; }
  .notice code { font-size: 0.8rem; }

  .skyline { display: block; width: 100%; height: 118px; margin-top: -8px; }
  .skyline g { animation: rise 0.9s cubic-bezier(0.2, 0.75, 0.2, 1) both; }
  .skyline .cornice { fill: var(--cornice); }
  .skyline .window { fill: var(--window); }
  .skyline .window.lit { fill: var(--window-lit); }
  .skyline .door { fill: var(--door); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .toolbar-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 12px var(--gutter);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .search { position: relative; flex: 1 1 240px; max-width: 420px; }
  .search svg {
    position: absolute; left: 12px; top: 50%; translate: 0 -50%;
    width: 16px; height: 16px; color: var(--ink-3); pointer-events: none;
  }
  .search kbd {
    position: absolute; right: 10px; top: 50%; translate: 0 -50%;
    padding: 1px 7px; border: 1px solid var(--rule); border-radius: 4px;
    font: 600 0.72rem/1.4 var(--body); color: var(--ink-3);
  }
  .field {
    height: 40px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--paper);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field:focus { outline: none; border-color: var(--palmetto); box-shadow: 0 0 0 3px color-mix(in srgb, var(--palmetto) 22%, transparent); }
  .search input { width: 100%; padding: 0 40px 0 36px; }
  .search input::placeholder { color: var(--ink-3); }
  select.field { padding: 0 30px 0 12px; }

  .segmented {
    display: inline-flex;
    padding: 3px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--paper-2);
  }
  .segmented button {
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-2);
    font-size: 0.86rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .segmented button:hover { color: var(--ink); }
  .segmented button[aria-pressed="true"] {
    background: var(--paper);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .segmented button:focus-visible { outline: 2px solid var(--palmetto); outline-offset: -2px; }
  .count { margin-left: auto; font-size: 0.85rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* ---------- Directory ---------- */
  .layout {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 var(--gutter) 72px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: 36px;
    align-items: start;
  }
  .directory { min-width: 0; padding-top: 8px; }

  .cols, .row {
    display: grid;
    grid-template-columns: 50px minmax(0, 1fr) 84px 112px 132px;
    grid-template-areas: "avatar main followers pop match";
    column-gap: 18px;
    align-items: center;
  }
  .cols {
    padding: 10px 12px;
    border-bottom: 2px solid var(--ink);
  }
  .cols > * { font: 700 0.68rem/1 var(--body); letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-3); }
  .cols .c-main { grid-row: 1; grid-column: avatar-start / main-end; }
  .cols .c-followers { grid-area: followers; justify-self: end; }
  .cols .c-pop { grid-area: pop; }
  .cols .c-match { grid-area: match; }
  .sort {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sort:hover, .sort.active { color: var(--ink); }
  .sort:focus-visible { outline: 2px solid var(--palmetto); outline-offset: 3px; border-radius: 2px; }
  .sort .arrow { font-size: 0.7rem; opacity: 0; }
  .c-followers .sort { flex-direction: row-reverse; }
  .sort.active .arrow { opacity: 1; }

  .row {
    width: 100%;
    padding: 12px;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .row:hover { background: var(--paper-2); }
  .row[aria-current="true"] { background: var(--paper-2); box-shadow: inset 3px 0 0 var(--palmetto); }
  .row:focus-visible { outline: 2px solid var(--palmetto); outline-offset: -2px; }
  .intro .row { animation: fade-up 0.45s ease both; animation-delay: calc(var(--i) * 22ms + 250ms); }

  /* Arched-window frame, after the doorways on Church Street. */
  .arch {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 50% 50% 4px 4px / 38% 38% 4px 4px;
    background: var(--tint, var(--sand));
    color: var(--ink);
    font-family: var(--display);
  }
  .arch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .row .arch { grid-area: avatar; width: 50px; height: 58px; font-size: 1.35rem; }
  .row:is(.m-none, .m-error) .arch { filter: grayscale(0.6); opacity: 0.75; }

  .main { grid-area: main; min-width: 0; display: grid; gap: 2px; }
  .name {
    font: 400 1.22rem/1.2 var(--display);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row:is(.m-none, .m-error) .name { color: var(--ink-2); }
  .meta, .genres { font-size: 0.82rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .genres { color: var(--ink-2); font-style: italic; }

  .followers { grid-area: followers; justify-self: end; font-weight: 600; font-variant-numeric: tabular-nums; }
  .followers.no-data { color: var(--ink-3); font-weight: 400; }
  .pop { grid-area: pop; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pop .track { flex: 0 0 64px; }
  .pop .track span { transition: none; }

  .row .badge { grid-area: match; }
  .badge {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 999px;
    font: 700 0.66rem/1.2 var(--body);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.m-linked { background: var(--linked-bg); color: var(--linked-fg); }
  .badge.m-name { background: var(--name-bg); color: var(--name-fg); }
  .badge.m-none { color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--rule); }
  .badge.m-error { color: var(--error-fg); box-shadow: inset 0 0 0 1px currentColor; }

  .empty {
    padding: 56px 12px;
    text-align: center;
    color: var(--ink-2);
  }
  .empty h2 { margin: 0 0 8px; font: 400 1.7rem/1.2 var(--display); color: var(--ink); }
  .empty p { max-width: 46ch; margin: 0 auto 18px; }
  .empty code { font-size: 0.85em; }
  .link-button {
    border: 0; background: none; padding: 0;
    color: var(--palmetto); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ---------- Detail panel ---------- */
  .panel {
    position: sticky;
    top: calc(var(--toolbar-h) + 20px);
    margin-top: 20px;
    max-height: calc(100vh - var(--toolbar-h) - 40px);
    overflow: auto;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: var(--paper-2);
    box-shadow: var(--shadow);
    overscroll-behavior: contain;
  }
  .panel-inner { padding: 22px; display: grid; gap: 16px; }
  .panel .arch.hero { width: 100%; aspect-ratio: 1; font-size: 4.5rem; border-radius: 50% 50% 8px 8px / 32% 32% 8px 8px; }
  .panel .arch.hero:not(:has(img)) { width: 46%; justify-self: center; }
  .panel-head { display: grid; gap: 8px; }
  .panel-head h2 { margin: 0; font: 400 2.1rem/1.05 var(--display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .panel-head .dis { margin: 0; color: var(--ink-3); font-style: italic; }
  .close {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--rule); border-radius: 50%;
    background: var(--paper); color: var(--ink-2);
    cursor: pointer;
  }
  .close:hover { color: var(--ink); }
  .close:focus-visible { outline: 2px solid var(--palmetto); outline-offset: 2px; }
  .close svg { width: 14px; height: 14px; }

  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    margin: 0;
    padding: 14px 0;
    border-block: 1px solid var(--rule);
  }
  .facts dt { font: 700 0.64rem/1 var(--body); letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-3); }
  .facts dd { margin: 5px 0 0; font-weight: 500; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--paper-3); font-size: 0.8rem; color: var(--ink-2); }
  .callout {
    margin: 0;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--name-bg);
    color: var(--name-fg);
    font-size: 0.86rem;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 16px;
    border-radius: 999px;
    font-weight: 600; font-size: 0.9rem; text-decoration: none;
    border: 1px solid var(--rule);
    background: var(--paper);
  }
  .btn.primary { background: var(--palmetto); border-color: var(--palmetto); color: var(--on-palmetto); }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--palmetto); outline-offset: 2px; }
  .btn svg { width: 15px; height: 15px; }
  .embed { width: 100%; height: 352px; border: 0; border-radius: 12px; background: var(--paper-3); }

  .placeholder { padding: 40px 28px; text-align: center; color: var(--ink-2); }
  .placeholder svg { width: 120px; height: auto; margin: 0 auto 18px; display: block; }
  .placeholder h2 { margin: 0 0 6px; font: 400 1.5rem/1.2 var(--display); color: var(--ink); }
  .placeholder p { margin: 0; font-size: 0.9rem; }
  .backdrop { display: none; }

  /* ---------- Motion ---------- */
  @keyframes rise { from { transform: translateY(120px); } to { transform: none; } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
    .cols, .row { grid-template-columns: 50px minmax(0, 1fr) 76px 120px; grid-template-areas: "avatar main followers match"; }
    .pop, .cols .c-pop { display: none; }
  }
  @media (max-width: 900px) {
    .mast-grid { grid-template-columns: 1fr; }
    .ledger { justify-items: start; min-width: 0; }
    .stats div { text-align: left; }
    .progress { text-align: left; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .panel {
      position: fixed;
      inset: auto 0 0 0;
      top: auto;
      z-index: 30;
      margin: 0;
      max-height: 88vh;
      border-radius: 18px 18px 0 0;
      border-bottom: 0;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.2, 0.75, 0.2, 1);
    }
    .panel-open .panel { transform: none; }
    .panel .arch.hero { width: 52%; justify-self: center; }
    .backdrop {
      display: block;
      position: fixed; inset: 0; z-index: 25;
      background: rgba(10, 16, 14, 0.45);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .panel-open .backdrop { opacity: 1; pointer-events: auto; }
    .panel .placeholder-wrap { display: none; }
  }
  @media (max-width: 640px) {
    .stats { gap: 20px; }
    .stats dd { font-size: 1.7rem; }
    .search { max-width: none; flex-basis: 100%; }
    .search kbd { display: none; }
    .segmented { order: 3; width: 100%; overflow-x: auto; }
    .segmented button { flex: 1 0 auto; }
    .count { margin-left: 0; }
    .cols, .row {
      grid-template-columns: 44px minmax(0, 1fr) auto;
      grid-template-areas: "avatar main followers" "avatar match match";
      row-gap: 6px;
      column-gap: 14px;
    }
    .cols { grid-template-areas: "avatar main followers"; }
    .cols .c-match { display: none; }
    .row .arch { width: 44px; height: 52px; font-size: 1.15rem; }
    .row { padding: 12px 4px; }
  }
</style>
</head>
<body>
  <header class="masthead">
    <div class="mast-grid">
      <div>
        <p class="kicker">A Lowcountry music directory</p>
        <h1>Charleston<small>artists on Spotify</small></h1>
        <p class="dek">Musicians based, born, or formed in Charleston, SC. Found through MusicBrainz, matched on Spotify.</p>
      </div>
      <div class="ledger">
        <dl class="stats">
          <div><dt>Artists</dt><dd id="stat-total">—</dd></div>
          <div><dt>On Spotify</dt><dd id="stat-spotify">—</dd></div>
          <div><dt>Refreshed</dt><dd class="when" id="stat-updated">never</dd></div>
        </dl>
        <button class="refresh" id="refresh" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
          <span>Refresh data</span>
        </button>
        <div class="progress" id="progress" hidden>

  const MATCH = {

  function renderStats() {

      <rect x="76" y="38" width="16" height="24" rx="2" style="fill: var(--window)"/>
      <rect x="28" y="74" width="16" height="24" rx="2" style="fill: var(--window)"/>
      <rect x="76" y="74" width="16" height="24" rx="2" style="fill: var(--window-lit)"/>
      <path d="M50 130 v-24 a10 10 0 0 1 20 0 v24 z" style="fill: var(--door)"/>
    </svg>`;
    return wrap.firstElementChild;
  }

  /* ---------- Interaction ---------- */
  function select(key) {
    const previous = state.selectedKey;
    state.selectedKey = key;
    for (const row of els.list.querySelectorAll(".row")) {
      if (row.dataset.key === key) row.setAttribute("aria-current", "true");
      else row.removeAttribute("aria-current");
    }
    renderPanel();
    if (!key && previous) els.list.querySelector(`[data-key="${CSS.escape(previous)}"]`)?.focus();
  }

  function clearFilters() {
    state.query = "";
    state.match = "all";
    state.type = "all";
    els.search.value = "";
    els.typeFilter.value = "all";
    syncMatchButtons();
    renderList();
  }

  function syncMatchButtons() {
    for (const btn of document.querySelectorAll("#match-filter button")) {
      btn.setAttribute("aria-pressed", String(btn.dataset.match === state.match));
    }
  }

  els.search.addEventListener("input", (e) => { state.query = e.target.value; renderList(); });
  els.typeFilter.addEventListener("change", (e) => { state.type = e.target.value; renderList(); });
  $("match-filter").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-match]");
    if (!btn) return;
    state.match = btn.dataset.match;
    syncMatchButtons();
    renderList();
  });
  $("cols").addEventListener("click", (e) => {
    const btn = e.target.closest(".sort");
    if (!btn) return;
    const key = btn.dataset.sort;
    if (state.sort === key) state.dir *= -1;
    else { state.sort = key; state.dir = DEFAULT_DIR[key]; }
    renderList();
  });
  els.refresh.addEventListener("click", refresh);
  $("backdrop").addEventListener("click", () => select(null));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.selectedKey) select(null);
    if (e.key === "/" && document.activeElement !== els.search && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      els.search.focus();
    }
  });
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty("--toolbar-h", `${entry.target.offsetHeight}px`);
  }).observe($("toolbar"));

  drawSkyline($("skyline"));
  loadArtists().catch(() => showNotice("Couldn't load artists from the server."));
</script>
</body>
</html>
